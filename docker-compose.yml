services:
  db:
    image: postgres:16-alpine
    container_name: widget-platform-db
    environment:
      POSTGRES_USER: widget
      POSTGRES_PASSWORD: widget
      POSTGRES_DB: widget_platform
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U widget -d widget_platform"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data:
