# Evaluator manifest — completed by submission time.
capstone: embeddable-widget-lead-capture-platform
language: python

run: docker compose up --build
seed: scripts/seed_demo.sh
test: pytest

base_url: http://localhost:8000

endpoints:
  admin:
    - POST /api/v1/auth/register
    - POST /api/v1/auth/login
    - POST /api/v1/widgets
    - GET /api/v1/widgets
    - GET /api/v1/widgets/{id}
    - PATCH /api/v1/widgets/{id}
    - DELETE /api/v1/widgets/{id}
    - GET /api/v1/dashboard/submissions?widget_id=&limit=&cursor=
    - GET /api/v1/dashboard/stats?days=30
  public:
    - GET /health
    - GET /widget.v1.js?id={widget_id}
    - GET /widget.js?id={widget_id}
    - GET /api/v1/public/widgets/{id}/config
    - POST /api/v1/public/submissions
